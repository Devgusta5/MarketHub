function renderSettingsContent(){let s=$('#settings-content');if(!s)return;
if(settingsTab==='apis')s.innerHTML=`<div class="settings-heading"><h3>Integrações de Inteligência Artificial</h3><p>Prepare os provedores que poderão alimentar a markethub.</p></div><div class="hintbox" style="margin-bottom:17px">${ico('shield',16)} <b>Cofre de chaves — apenas representação visual.</b> Não cole credenciais reais neste protótipo. As chaves deverão ser armazenadas no servidor com criptografia e acesso administrativo independente.</div>${[['OpenAI','Análise, texto e imagem','sparkles'],['Google Gemini','Visão e imagens econômicas','image'],['Runway','Vídeo generativo opcional','video']].map(([n,d,i])=>`<div class="provider-row"><span class="provider-icon">${ico(i,21)}</span><div class="grow"><strong>${n}</strong><small>${d}</small></div><span class="chip">Não conectado</span><button class="btn small outline" data-keyinfo="${n}">Configurar</button></div>`).join('')}<div class="divider"></div><h3 style="margin-bottom:8px">Projeto de segurança</h3><p class="quiet">A versão real terá cofre no servidor, autenticação administrativa separada da conta operacional compartilhada, gravação criptografada, teste de conexão via backend e possibilidade de revogação e rotação de chaves.</p>`;
if(settingsTab==='costs')s.innerHTML=`<div class="settings-heading"><h3>Gestor Financeiro de IA</h3><p>Orçamento global e limites individuais por empresa, com bloqueio e retomada após recarga confirmada.</p></div><div class="kpi" style="margin-bottom:14px"><span>Orçamento demonstrativo global</span><strong>R$ 500,00</strong><span>Consumo real de API neste protótipo: R$ 0,00</span></div><div class="budget-bar" style="margin:14px 0 18px"><span style="width:0%"></span></div>${COMPANIES.map(c=>`<div class="flex between" style="padding:10px 0;border-bottom:1px solid var(--line)"><span style="font-size:12px">${esc(c)}</span><span class="chip">Limite configurável no backend</span></div>`).join('')}<div class="hintbox" style="margin-top:16px">O protótipo não processa pagamentos nem verifica créditos de fornecedores. Todas as decisões financeiras aprovadas estão previstas para a implementação.</div>`;
if(settingsTab==='visual')s.innerHTML=`<div class="settings-heading"><h3>Aparência</h3><p>Ajustes pessoais deste navegador.</p></div><div class="provider-row"><span class="provider-icon">${ico('sun',21)}</span><div class="grow"><strong>Tema da interface</strong><small>Modo claro e escuro</small></div><button class="btn small outline" id="settings-theme">${prefs.theme==='dark'?'Ativar claro':'Ativar escuro'}</button></div><div class="provider-row"><span class="provider-icon">${ico('target',21)}</span><div class="grow"><strong>Universo espacial</strong><small>Centralizar a câmera no catálogo</small></div><button class="btn small outline" id="settings-center">Centralizar</button></div>`;
if(settingsTab==='about')s.innerHTML=`<div class="settings-heading"><h3>Sobre este protótipo</h3><p>Versão 2.0 · demonstração HTML local</p></div><div class="hintbox">Nenhuma chave real, login externo ou API é utilizada. Produtos e conteúdos de exemplo são persistidos apenas no navegador usando armazenamento local.</div><div class="divider"></div><button class="btn outline" id="reset-data">${ico('refresh',16)} Restaurar dados de demonstração</button><p class="quiet" style="margin-top:10px">Essa ação remove apenas o estado de demonstração salvo neste navegador.</p>`;
$$('[data-keyinfo]',s).forEach(b=>b.onclick=()=>{const name=b.dataset.keyinfo;openCustom('keyinfo',`<div class="scrim" data-close></div><div class="modal"><div class="modal-head"><div><div class="eyebrow">PAINEL DE INTEGRAÇÕES</div><h2>${esc(name)}</h2></div><button class="icon-btn" data-close>${ico('close')}</button></div><div class="field"><label>Chave de API — desativada neste protótipo</label><input disabled type="password" placeholder="••••••••••••••••••••" autocomplete="off"/></div><div class="hintbox">Nenhuma credencial será solicitada ou salva no HTML. Quando o backend seguro existir, um administrador autenticado poderá cadastrar e testar a chave sem expô-la aos usuários comuns.</div><div class="modal-action"><button class="btn outline" id="back-apis">Voltar às integrações</button><button class="btn primary" disabled>Testar conexão</button></div></div>`);$$('[data-close]', $('#overlay-root')).forEach(el=>el.onclick=()=>{settingsTab='apis';renderSettings()});$('#back-apis').onclick=()=>{settingsTab='apis';renderSettings()}});
if($('#settings-theme'))$('#settings-theme').onclick=()=>{prefs.theme=prefs.theme==='light'?'dark':'light';applyTheme();renderSettings()};if($('#settings-center'))$('#settings-center').onclick=()=>{closeOverlay();showHome();centerHome()};if($('#reset-data'))$('#reset-data').onclick=()=>{if(confirm('Restaurar todos os produtos e tarefas da demonstração neste navegador?')){localStorage.removeItem('cia.products.v1');localStorage.removeItem('cia.jobs.v1');products=seed.map(sampleProduct);jobs=[];wsTabs=[];renderUniverse();renderDock();closeOverlay();showHome();toast('Dados de demonstração restaurados.')}};
}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showHome();closeOverlay();$('#search').focus();$('#search').select()}if(e.key==='Escape'){if(creation.open&&!creation.minimized)minimizeCreation();else if(overlay)closeOverlay();else clearSearch()}});
renderUniverse();initView();renderDock();if(creation.open){renderCreate();toast('Você tem um rascunho recuperável. Use o painel minimizado para retomar.')}window.addEventListener('resize',()=>{if(displayView==='home'&&products.length){/* preserve current coordinates on resize */} });
})();
</script>
</body>
</html>
